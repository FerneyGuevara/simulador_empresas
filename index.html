'soc':['Tipo de sociedad','Forma jurídica con la que se constituiría la empresa.','Determina cómo se toman las decisiones y cómo responden legalmente los socios.','La SAS (Ley 1258 de 2008) es la más usada por emprendedores en Colombia por ser ágil y de bajo costo.','{nm} S.A.S.'],
'tam':['Número de trabajadores','Cantidad de personas que tendría la empresa (de 3 a 12).','Define el tamaño del organigrama y cuántos manuales de funciones se generan.','Sean realistas: una empresa nueva no necesita muchos jefes.','8 trabajadores: un gerente, jefes de área y operarios.'],
'prod':['Producto o servicio','Lo que la empresa ofrece a sus clientes.','Define el portafolio y orienta la misión y los procesos.','Escriban una línea por cada producto o servicio, con una frase que lo describa.','{pr}'],
'cli':['Clientes objetivo','Grupo de personas o empresas al que se dirige la oferta.','Permite diseñar publicidad, precios y atención adecuados.','Describan edad, ubicación, ocupación y necesidades. Eviten “todo el mundo”.','{cl}','Mientras más específico el cliente, más fácil es venderle.'],
'comp':['Competidores principales','Negocios que ya ofrecen algo parecido.','Ayuda a ver qué hacen bien y cómo diferenciarse.','Nombren 2 o 3 competidores reales y digan en qué son mejores ustedes.','Competidor del sector de {ar} con precios bajos pero sin atención personalizada.'],
'valor':['Propuesta de valor','La razón por la que un cliente los elegiría a ustedes y no a la competencia.','Es el corazón del negocio: alimenta la misión y la estrategia.','Respondan: ¿qué problema resuelven y qué hacen mejor o distinto?','{vl}'],
'nom':['Nombre de la empresa','Nombre con el que se conocerá la empresa.','Es la base de la identidad y aparece en todo el documento.','Que sea corto, fácil de recordar y relacionado con el negocio. Verifiquen que no sea una marca conocida.','Un nombre corto que evoque {ar}.'],
'lema':['Eslogan','Frase corta que resume la promesa de la marca.','Comunica en pocas palabras lo que los hace diferentes.','Máximo 30 letras: es lo que cabe en la cinta del escudo.','Para {nm}: «Calidad que se nota».'],
'sig':['Significado del nombre','Origen o inspiración del nombre elegido.','Da sentido y coherencia a la marca.','Cuenten de dónde viene el nombre y qué simboliza.','{nm} nace de la idea de…'],
'c.*':['Colores institucionales','Los tres colores que identifican la marca.','Transmiten emociones y se usan en el escudo, la bandera y el logo.','Elijan una paleta o personalícenla. Principal: fondo; secundario: detalles; acento: bordes.','El azul transmite confianza; el verde, sostenibilidad.'],
'csig':['Significado de los colores','Qué representa cada color de la marca.','Justifica las decisiones de diseño.','Expliquen cada color con una cualidad de la empresa.','Azul: confianza. Dorado: excelencia en {ar}.'],
'fnt':['Estilo de letra','Tipo de letra del logo y de la cinta del escudo.','Cambia la personalidad de la marca: seria, moderna o cercana.','Elijan la que mejor represente a su público.','Para {nm}, vean la muestra que aparece debajo.'],
'esc.*':['Escudo','Emblema de la empresa: forma, división del campo, símbolo y laurel.','Representa visualmente la identidad y se usa en documentos y portadas.','Elijan un símbolo relacionado con {ar}. Usen “Sorpréndeme” para ver combinaciones.','Para {nm}: símbolo ligado a {ar}.','Menos es más: un símbolo claro se reconoce mejor.'],
'ban':['Bandera','Insignia de la empresa con sus colores.','Complementa la identidad en eventos y presentaciones.','Elijan un patrón que combine bien con sus tres colores.','La bandera de {nm} usa sus colores institucionales.'],
'logo':['Logo','Imagen que identifica a la empresa junto a su nombre.','Es la cara de la marca en documentos, redes y productos.','Elijan el estilo que mejor se lea. Prueben los tres.','Logo de {nm} con su eslogan.'],
'us.*':['Origen de la imagen','Elegir entre el diseño de la app o una imagen propia.','Permite usar un diseño hecho por ustedes o con una herramienta externa.','Elijan “Mi propio diseño” y carguen un PNG, JPG, WebP o SVG. Usen imágenes propias o con permiso de uso.','Logo de {nm} creado por el equipo.'],
'dir.mis':['Misión','La razón de ser de la empresa: qué hace, para quién y cómo.','Orienta las decisiones del día a día.','Una o dos frases en presente: qué hacemos, para quién, cómo y con qué valores.','{nm} es una empresa de {tp} que ofrece {pr} a {cl}.','Una buena misión no promete el futuro: describe lo que hacen hoy.'],
'dir.vis':['Visión al año 2030','Lo que la empresa quiere ser en el largo plazo.','Da dirección y ambición al proyecto.','Una frase en futuro: “Para 2030, seremos…”. Sean ambiciosos pero realistas.','Para el año 2030, {nm} será reconocida a nivel nacional por la calidad de su oferta.'],
'dir.val':['Valores corporativos','Principios que guían el comportamiento de todos en la empresa.','Definen la cultura y se usan para evaluar el desempeño.','Elijan de 4 a 6 que realmente puedan practicar.','{nm} elige valores que respalden su propuesta: {vl}.'],
'dir.ob.*':['Objetivo estratégico','Resultado concreto que la empresa quiere alcanzar.','Es la base de los indicadores y los planes de acción que se trabajarán después.','Que sea específico, medible, alcanzable, relevante y con plazo. Empiecen con un verbo.','Aumentar las ventas de {nm} en un 15 % en 12 meses.','Si no se puede medir, no es un objetivo: es un deseo.'],
'pol.*':['Política','Compromiso escrito que orienta cómo actúa la empresa en un tema.','Sirve como brújula para decidir y resolver problemas.','Una o dos frases claras que digan qué se compromete a hacer la empresa y cómo.','{nm} se compromete a cumplir lo que promete a sus clientes y trabajadores.'],
'pm.e':['Procesos estratégicos','Procesos que definen el rumbo y controlan a la empresa.','Dirigen a los demás procesos.','Uno por línea: planeación, calidad y análisis del entorno.','Planeación estratégica de {nm}.'],
'pm.m':['Procesos misionales','Procesos que generan el producto o servicio y llegan al cliente.','Son el flujo central: del pedido del cliente a su satisfacción.','Uno por línea, en el orden en que ocurren.','Cada proceso entrega su resultado al siguiente.','El orden importa: es una secuencia, no una lista de ideas.'],
'pm.a':['Procesos de apoyo','Procesos que dan soporte a los demás (personas, dinero, tecnología).','Sin ellos, los demás no funcionan.','Uno por línea: talento humano, administración y finanzas, tecnología, SST.','Gestión del talento humano de {nm}.'],
'ps.*.s':['Salida del proceso','Resultado que entrega el proceso al terminar.','Se convierte en la entrada del siguiente proceso.','Escriban el entregable concreto: un servicio realizado, un pedido, un informe.','Pedido confirmado, servicio prestado.'],
'ps.*.r':['Responsable del proceso','Cargo que responde por el proceso.','Asegura que alguien responda por cada proceso.','Elijan un cargo del organigrama.','El cargo que dirige el proceso en {nm}.'],
'org.*.n':['Cargo','Nombre del puesto dentro del organigrama.','Cada cargo tiene su propio manual de funciones.','Pueden renombrarlo según su empresa. Debe ser claro y realista para {tp}.','Jefe de Talento Humano.'],
'man.*.obj':['Objetivo del cargo','Para qué existe este cargo.','Aclara el propósito y evita funciones sueltas.','Una frase que empiece con un verbo y diga qué logra el cargo para {nm}.','Gestionar el talento humano de {nm}.'],
'man.*.fun':['Funciones','Actividades que realiza quien ocupa el cargo.','Permiten saber qué se espera y evaluar el desempeño.','De 4 a 6 funciones, cada una con un verbo de acción.','Elaborar contratos y realizar la inducción.'],
'man.*.res':['Responsabilidades','Aquello de lo que responde el cargo: resultados, bienes y normas.','Define el alcance del cargo.','De 3 a 4 responsabilidades que se puedan verificar.','Confidencialidad de la información del personal.'],
'man.*.per':['Perfil y competencias','Formación, experiencia y habilidades requeridas.','Se usa para seleccionar y evaluar al personal.','Indiquen estudios, experiencia y 3 o 4 competencias.','Técnico en el área, 6 meses de experiencia, trabajo en equipo.']};

function generarIdeasNegocio(){
const idea=(S.idea||S.ideaTxt||'').toLowerCase();
const area=(S.area||'').toLowerCase();
let prod='',cli='',comp='',valor='',obj='',act='';

if(idea.includes('plataforma')||idea.includes('app')||idea.includes('digital')){
prod='Plataforma digital innovadora que conecta usuarios con servicios especializados de alta calidad. El sistema incluye funcionalidades avanzadas como reservas en línea con calendario inteligente, seguimiento en tiempo real del servicio mediante geolocalización, sistema de calificación y reseñas verificadas, múltiples métodos de pago integrados (tarjetas, billeteras digitales, PSE), chat directo con prestadores del servicio, historial completo de transacciones, y notificaciones push personalizadas. La plataforma está disponible tanto en aplicación móvil nativa (iOS y Android) como en versión web responsive, garantizando una experiencia de usuario fluida y consistente en todos los dispositivos.';

cli='El mercado objetivo principal son profesionales urbanos entre 25 y 45 años, con ingresos medios-altos, que valoran significativamente su tiempo y buscan soluciones convenientes para sus necesidades cotidianas. Este segmento se caracteriza por su alta adopción tecnológica, uso frecuente de smartphones, y disposición a pagar un premium por servicios que les aporten comodidad, confiabilidad y ahorro de tiempo. Como mercado secundario, nos enfocamos en pequeñas y medianas empresas (de 5 a 50 empleados) que requieren servicios especializados de manera recurrente y buscan optimizar sus procesos administrativos mediante soluciones digitales. Geográficamente, nos concentramos en áreas urbanas y suburbanas con buena conectividad a internet y alta densidad poblacional.';

comp='El panorama competitivo incluye tres grandes segmentos: (1) Plataformas digitales consolidadas del mismo sector que cuentan con reconocimiento de marca y base de usuarios establecida, aunque muchas presentan problemas de calidad del servicio y tiempos de respuesta lentos; (2) Empresas tradicionales con presencia física que están en proceso de transformación digital, ofreciendo servicios híbridos pero con menor agilidad tecnológica; y (3) Profesionales independientes y freelancers que brindan servicios directamente a través de redes sociales o referencias, con costos más competitivos pero sin garantías formales ni estructura organizacional. La competencia varía desde grandes corporaciones con cobertura nacional hasta microemprendimientos locales que compiten principalmente por precio.';

valor='Nuestra propuesta de valor diferenciadora se fundamenta en cinco pilares estratégicos: (1) Velocidad de respuesta garantizada con asignación de servicio en menos de 2 horas o compensación del 20% del valor; (2) Sistema riguroso de verificación, certificación y evaluación continua de todos los prestadores de servicio, incluyendo validación de documentos, antecedentes y capacitación inicial obligatoria; (3) Garantía total de satisfacción con política de devolución del 100% si el servicio no cumple con las expectativas declaradas, sin preguntas adicionales; (4) Programa de fidelización escalonado que ofrece descuentos progresivos del 5% al 25% según el nivel de uso, puntos acumulables y acceso a servicios premium exclusivos; y (5) Soporte al cliente disponible 24/7 a través de múltiples canales (chat, teléfono, email) con tiempo de respuesta menor a 15 minutos, además de una interfaz de usuario intuitiva diseñada según principios de UX/UI modernos que facilita la navegación incluso para usuarios con poca experiencia tecnológica.';

obj='La compañía tiene como objeto social principal la prestación de servicios de intermediación tecnológica mediante plataforma digital, conectando usuarios finales con prestadores de servicios profesionales especializados en diversas categorías. Las actividades incluyen: desarrollo, implementación, operación, mantenimiento y mejora continua de aplicaciones móviles y soluciones web; procesamiento y facilitación de pagos digitales actuando como tercero de confianza; gestión y administración de bases de datos de usuarios y prestadores de servicios; mercadeo digital y promoción de servicios; atención al cliente y soporte técnico; control de calidad y supervisión de estándares de servicio; capacitación y certificación de prestadores; así como todas las actividades comerciales, tecnológicas y administrativas conexas, relacionadas o complementarias con la intermediación de servicios profesionales a través de medios electrónicos y digitales, conforme a la legislación vigente.';

act='Actividad económica principal clasificada como desarrollo de sistemas informáticos y procesamiento de datos (CIIU Rev. 4 A.C.: 6201 - Actividades de desarrollo de sistemas informáticos, 6311 - Procesamiento de datos, alojamiento y actividades relacionadas). Las operaciones incluyen la intermediación de servicios especializados a través de plataformas tecnológicas propias, abarcando la gestión integral de bases de datos relacionales y no relacionales de prestadores de servicios verificados, procesamiento seguro de transacciones electrónicas mediante pasarelas de pago certificadas, servicios de atención al cliente digital multicanal, análisis de datos y business intelligence para optimización de procesos, y mantenimiento de infraestructura tecnológica en la nube. Como actividades secundarias se contemplan servicios de consultoría tecnológica, capacitación en uso de plataformas digitales, y actividades de mercadeo digital relacionadas con la promoción de servicios.';

}else{
prod='Portafolio integral de productos y servicios especializados en el sector de '+area+', cuidadosamente diseñados y estructurados para satisfacer las necesidades específicas y diversas del mercado objetivo. La oferta incluye tres líneas claramente diferenciadas: (1) Línea Básica, orientada a clientes que buscan soluciones funcionales y accesibles con excelente relación precio-valor; (2) Línea Premium, dirigida a clientes que demandan especificaciones superiores, personalización avanzada y atención preferencial; y (3) Línea Empresarial, diseñada específicamente para organizaciones que requieren volumen, contratos a mediano y largo plazo, y servicios de soporte dedicado. Todos los productos/servicios cuentan con garantía certificada, cumplimiento de normas técnicas vigentes, atención personalizada en cada etapa del proceso, y programa de soporte continuo post-venta que incluye mantenimiento preventivo, asesoría técnica especializada, y actualizaciones según corresponda.';

cli='El perfil del cliente objetivo abarca un público diverso interesado en '+area+', con enfoque principal en personas entre 18 y 55 años pertenecientes a estratos socioeconómicos 3, 4 y 5, que representan el segmento de mayor capacidad adquisitiva y disposición de compra en el mercado. Este público incluye tanto clientes individuales y consumidores finales que toman decisiones de compra para uso personal o familiar, como empresas pequeñas y medianas (pymes de 3 a 50 colaboradores) que requieren soluciones comerciales o industriales en este campo de manera recurrente o puntual. Los clientes se caracterizan por valorar especialmente la relación calidad-precio, buscando proveedores que ofrezcan no solo productos o servicios competitivos, sino también confiabilidad demostrada, buena reputación en el mercado, respaldo post-venta efectivo, y transparencia en sus procesos comerciales. Geográficamente, el mercado se concentra inicialmente en zonas urbanas principales y sus áreas metropolitanas, con potencial de expansión hacia ciudades intermedias.';

comp='El entorno competitivo está conformado por diversos actores con características diferenciadas: (1) Empresas consolidadas y establecidas del sector que cuentan con varios años de experiencia acumulada, reconocimiento de marca bien posicionado, base de clientes leales, infraestructura robusta y recursos financieros significativos, aunque frecuentemente presentan estructuras menos ágiles y mayor rigidez en sus procesos; (2) Nuevos emprendimientos y startups que están ingresando al mercado con propuestas innovadoras, modelos de negocio disruptivos, mayor flexibilidad operativa y enfoque en experiencia del cliente, pero que aún carecen de trayectoria comprobada y presencia consolidada; y (3) Profesionales independientes, técnicos especializados y pequeños talleres que ofrecen servicios similares de manera informal o semiformal, generalmente con precios más bajos pero sin las garantías, respaldos formales, cumplimiento normativo ni estructura organizacional de empresas constituidas. El tamaño de la competencia varía significativamente, desde microempresas unipersonales hasta corporaciones de mediano y gran tamaño con cobertura regional o nacional, cada una compitiendo con estrategias diferenciadas según su segmento.';

valor='La propuesta de valor diferenciadora se articula sobre cuatro pilares fundamentales que nos distinguen claramente en el mercado: (1) Atención personalizada y trato cercano de calidad humana que contrasta positivamente con el servicio automatizado, despersonalizado y transaccional que ofrecen las grandes empresas, donde cada cliente es tratado como un número más; nuestro equipo conoce a los clientes por nombre, entiende sus necesidades específicas y construye relaciones de largo plazo; (2) Precios altamente competitivos con excelente y verificable relación calidad-precio, resultado de una estructura de costos optimizada, negociaciones favorables con proveedores, y márgenes razonables que priorizan volumen y fidelización sobre rentabilidad inmediata, permitiendo ofrecer hasta 15-20% menos que competidores equivalentes sin sacrificar calidad; (3) Flexibilidad integral en formas de pago (efectivo, transferencias, tarjetas de crédito con cuotas, crédito directo para clientes recurrentes) y horarios de atención extendidos que se adaptan a las necesidades reales de los clientes, incluyendo atención en fines de semana y posibilidad de agendamiento según conveniencia; y (4) Compromiso genuino y demostrable con la satisfacción del cliente, evidenciado en garantías extendidas superiores al estándar del sector, servicio post-venta proactivo con seguimiento sistemático, política de devoluciones justa y transparente, y disposición real para resolver cualquier inconveniente hasta lograr la plena satisfacción.';

obj='La sociedad se constituye con el objeto social principal de desarrollar las siguientes actividades: comercialización al por mayor y al detal de productos relacionados con '+area+', y/o prestación de servicios profesionales y técnicos especializados en dicho campo, incluyendo diseño, implementación, instalación, mantenimiento preventivo y correctivo, reparación, actualización y optimización según corresponda a la naturaleza del negocio. Adicionalmente, la compañía podrá dedicarse a: asesoría técnica y consultoría especializada para clientes corporativos e individuales; capacitación, entrenamiento y transferencia de conocimiento; representación comercial y distribución de marcas nacionales e internacionales mediante acuerdos de representación o distribución exclusiva o no exclusiva; importación y exportación de bienes y servicios relacionados; actividades de investigación, desarrollo e innovación (I+D+i) orientadas a mejorar procesos y productos; y en general, todas las actividades comerciales, industriales, de servicios, financieras (excepto las reservadas por ley a establecimientos de crédito), conexas, relacionadas, complementarias o que contribuyan al desarrollo y cumplimiento del objeto social principal, conforme a la legislación mercantil, tributaria y sectorial aplicable.';

act='Las actividades económicas principales se clasifican según el Código CIIU Rev. 4 A.C. en el sector correspondiente a '+area+', abarcando: comercialización al por mayor y al por menor de productos especializados, con operaciones tanto en establecimiento físico propio como mediante canales digitales (comercio electrónico); prestación de servicios técnicos y profesionales especializados, incluyendo diagnóstico, diseño de soluciones, implementación, instalación, configuración, puesta en marcha, mantenimiento preventivo programado y correctivo según demanda, reparación, actualización tecnológica y optimización de rendimiento; servicios de asesoría técnica especializada y consultoría estratégica para optimización de procesos, selección de soluciones óptimas y maximización de inversión; capacitación técnica y entrenamiento de personal del cliente en uso, operación, mantenimiento básico y mejores prácticas; y actividades complementarias que apoyen el desarrollo del objeto social principal. Como actividades secundarias se contemplan: representación comercial de marcas reconocidas, distribución autorizada de productos relacionados, importación de bienes y tecnologías no disponibles en el mercado local, y exportación de servicios o productos de valor agregado a mercados internacionales según oportunidades.';
}

const STW=new Set('de del la las el los y e o u a al en con para por sin sobre un una unos unas que se su sus lo le les mas como entre desde hasta hacia ante bajo tras mi tu ti es son ser este esta estos estas ese esa clientes cliente empresa empresas sector terciario secundario primario cuaternario servicios servicio productos producto actividad area tipo calidad gran grande alta alto nuevo nueva mercado venta ventas ofrece ofrecemos presta prestacion comercializacion dirigidos diferentes diversos todos todas cada donde cuando pero tambien muy menos digital digitales virtual virtuales innovadora innovadoras innovador innovadores especializado especializados especializada especializadas personalizado personalizados personalizada personalizadas conecta conectan ofrece brinda brindamos permite incluye genera vende fabrica produce realiza presta venta online linea'.split(' '));
const ADJ=/(adora|adoras|ador|adores|mente|ivo|iva|ivos|ivas)$/;
const nz2=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function kws(t,m,st){t=String(t||'').split('\n')[0].split(/[.(:;–—]/)[0];const o=[];(t.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{4,}/g)||[]).forEach(w=>{const l=w.toLowerCase();if(!STW.has(nz2(l))&&!(st&&ADJ.test(nz2(l)))&&!o.includes(l)&&l.length<=13)o.push(l)});return o.slice(0,m)}
function genNom(){
const P=[kws(S.area,3),kws(S.prod,3,1),kws(S.act,3,1)],all=[...new Set(P.flat())];
if(!all.length)return null;
const R=a=>a[Math.floor(Math.random()*a.length)],sf=a=>[...a].sort(()=>Math.random()-.5),C=w=>w[0].toUpperCase()+w.slice(1),
LB=['área de interés','producto o servicio','actividad económica'],
pk=(i,...x)=>{let p=P[i%3].filter(w=>!x.includes(w));if(!p.length)p=all.filter(w=>!x.includes(w));if(!p.length)p=all;const w=R(p);return{w,s:P[i%3].includes(w)?i%3:P.findIndex(q=>q.includes(w))}},

ac=String(S.act||S.prod||'').split('\n')[0].split(/[.(]/)[0].trim().slice(0,90).toLowerCase(),
tm=sf(NT),out=[],vn=new Set(),vl=new Set();
for(let i=0;i<10;i++){let ok=0;for(let t=0;t<60&&!ok;t++){
const a=pk(i),b=pk(i+2,a.w),c=pk(i+1,a.w,b.w),f=tm[(i+(t>>2))%tm.length],two=f.length==2,n=f(C(a.w),C(b.w)),l=R(SL)(c.w);
if(n.length>26||l.length>30||vn.has(n)||vl.has(l))continue;
vn.add(n);vl.add(l);ok=1;
out.push({n,l,a:LB[a.s]+(two?' + '+LB[b.s]:''),b:LB[c.s],s:'«'+n+'» nace de «'+a.w+'» ('+LB[a.s]+')'+(two?' y «'+b.w+'» ('+LB[b.s]+')':'')+'. Su eslogan «'+l+'» resalta «'+c.w+'» ('+LB[c.s]+')'+(ac?' y comunica a qué se dedica la empresa: '+ac+'.':'.')})}
if(!ok){const a=pk(i),n=C(a.w)+' '+['Express','Plus','Vital','Integral','Pro'][i%5];out.push({n,l:'Calidad que inspira confianza',a:LB[a.s],b:'general',s:'«'+n+'» nace de «'+a.w+'» ('+LB[a.s]+').'})}}
return out}

function vdesc(v){const x=VAL.find(y=>y[0]==v);if(x)return x[1];const o=OC().find(y=>(y.n||'').trim()==v);return o&&o.d?o.d:''}

function vOtro(c){S.dir.oo=c?1:0;if(c&&!OC().length)OC().push({n:'',d:''});vSync();vox()}
